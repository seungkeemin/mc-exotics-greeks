[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-exotics"
version = "0.1.0"
description = "Monte Carlo pricing and finite-difference Greeks for digital and barrier options"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
notebook = ["matplotlib", "jupyterlab", "nbconvert", "nbformat"]
dev = ["pytest", "nbformat"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
